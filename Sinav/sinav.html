<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oyun YZ Ara Sınav</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2430; --muted:#5f6b7a; --line:#dfe3ea;
  --accent:#3b5bdb; --accent-soft:#e8edff; --ok:#1f8a4c; --ok-soft:#e3f5ea; --bad:#c92a2a; --bad-soft:#fdeaea;
  --chip:#eef1f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa4b2; --line:#2c3340;
    --accent:#7d95ff; --accent-soft:#252d4a; --ok:#52c27f; --ok-soft:#173225; --bad:#ff7b7b; --bad-soft:#3a1f22;
    --chip:#232a35;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa4b2; --line:#2c3340;
  --accent:#7d95ff; --accent-soft:#252d4a; --ok:#52c27f; --ok-soft:#173225; --bad:#ff7b7b; --bad-soft:#3a1f22;
  --chip:#232a35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:2px 8px 2px 0;min-width:70px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;font-size:.95rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.q.ok{border-color:var(--ok)}
.q.bad{border-color:var(--bad)}
.meta{display:flex;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.tag{background:var(--chip);border-radius:6px;padding:1px 8px}
.qt{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tf{display:flex;gap:8px}
.tf .opt{text-align:center}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:160px}
.track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.fillbar{height:100%;background:var(--accent);width:0}
.small{font-size:.85rem;color:var(--muted)}
.result table{width:100%;border-collapse:collapse;margin-top:8px}
.result td,.result th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;font-size:.93rem}
.big{font-size:2rem;font-weight:700}
.hide{display:none}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow">
    <div>
      <h1>Dijital Oyunlarda Yapay Zekâ — Ara Sınav Çalışması</h1>
      <p class="sub">Hafta 1–7 · Test, boşluk doldurma, doğru / yanlış · Hesaplama sorusu yok</p>
    </div>
    <button class="chip" id="themeBtn" title="Tema">◐</button>
  </div>

  <div class="panel">
    <div class="row"><span class="label">Mod</span>
      <button class="chip on" data-mode="study">Çalışma (anında cevap)</button>
      <button class="chip" data-mode="exam">Sınav (sonda puan)</button>
    </div>
    <div class="row" style="margin-top:8px"><span class="label">Hafta</span><span id="weekChips" class="row"></span></div>
    <div class="row" style="margin-top:8px"><span class="label">Tür</span>
      <button class="chip on" data-type="mc">Test</button>
      <button class="chip on" data-type="fill">Boşluk</button>
      <button class="chip on" data-type="tf">Doğru/Yanlış</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="startBtn">Yeni deneme başlat (karışık)</button>
      <button class="btn ghost" id="wrongBtn">Yalnızca yanlışlarımı tekrar çöz</button>
    </div>
    <p class="small" id="info" style="margin:8px 0 0"></p>
  </div>

  <div id="result" class="panel result hide"></div>
  <div id="list"></div>
</div>

<div class="bar"><div class="in">
  <div class="prog"><div class="small" id="progText">0 / 0</div><div class="track"><div class="fillbar" id="progBar"></div></div></div>
  <button class="btn" id="finishBtn">Sınavı bitir</button>
</div></div>

<script>
// t: mc (test), tf (doğru/yanlış), fill (boşluk). w: hafta. e: açıklama.
const Q = [
// ---------------- HAFTA 1
{w:1,t:'mc',q:"Yalnızca 'oyuncu menzilde mi?' karşılaştırması yapılırken Unity'de neden magnitude yerine sqrMagnitude tercih edilir?",o:["Karekök almak pahalı bir işlemdir, karşılaştırmada gerekmez","sqrMagnitude daha kesin sonuç verir","magnitude negatif değer döndürebilir","sqrMagnitude yönü de hesaba katar"],a:0,e:"Karşılaştırma için kareleri karşılaştırmak yeterlidir: d² ≤ menzil². Karekökten kurtuluruz."},
{w:1,t:'mc',q:"İleri vektörü ile hedefe giden birim vektörün nokta çarpımı pozitif ise hedef nerededir?",o:["Ajanın arkasında","Ajanın önünde (açı 90°'den küçük)","Tam yanında","Ajanın üstünde"],a:1,e:"> 0 önünde, = 0 tam yanında (90°), < 0 arkasında."},
{w:1,t:'mc',q:"Unity'de (sol el, y yukarı) Vector3.Cross(ileri, hedefYönü).y > 0 ise hedef nerededir?",o:["Solda","Sağda","Önde","Arkada"],a:1,e:"Unity'de işaret 2B formülün tersidir: pozitif y → sağda."},
{w:1,t:'mc',q:"Bir yönün açısını bulurken neden atan yerine atan2 kullanılır?",o:["Daha hızlı çalışır","Dört bölgeyi (çeyreği) birbirinden ayırabilir","Dereceyle sonuç verir","Sıfır vektörü de işleyebilir"],a:1,e:"atan(Δy/Δx) zıt çeyrekleri karıştırır; atan2 işaretlere bakarak doğru çeyreği seçer."},
{w:1,t:'mc',q:"Bir dünya noktasının ajanın yerel uzayındaki karşılığını Unity'de hangi fonksiyon verir?",o:["transform.TransformPoint","transform.InverseTransformPoint","transform.TransformDirection","Vector3.Project"],a:1,e:"InverseTransformPoint: dünya → yerel. TransformPoint: yerel → dünya."},
{w:1,t:'mc',q:"Hedef ajanın yerel uzayına taşındığında yerel.z > 0 ne anlama gelir?",o:["Hedef sağdadır","Hedef soldadır","Hedef önündedir","Hedef yukarıdadır"],a:2,e:"Unity'de yerel +z ileri, +x sağdır."},
{w:1,t:'tf',q:"Sıfır vektör (0, 0) normalize edilebilir.",a:false,e:"Normalizasyon uzunluğa bölmektir; sıfıra bölme olur. Uzunluk çok küçükse vektör olduğu gibi bırakılır."},
{w:1,t:'tf',q:"Unity sol el koordinat sistemi kullanır: X sağ, Y yukarı, Z ileri.",a:true,e:"YZ çoğunlukla yer düzleminde (x, z) düşünür."},
{w:1,t:'tf',q:"Yön vektörü normalize edilmeden hızla çarpılırsa ajan uzaktaki hedefe daha hızlı, yakındakine daha yavaş koşar.",a:true,e:"Doğru kullanım: hız = birim(hedef − konum) × maxHız."},
{w:1,t:'tf',q:"Görüş konisi kontrolünde pahalı acos yerine nokta çarpım sonucu cos(yarım açı) eşiğiyle karşılaştırılabilir.",a:true,e:"Birim vektörlerde a·b = cos θ olduğu için doğrudan eşikle karşılaştırırız."},
{w:1,t:'fill',q:"Bir vektörü yönü aynı kalacak, uzunluğu 1 olacak şekilde kendi uzunluğuna bölme işlemine ____ denir.",a:["normalizasyon","normalleştirme","normalize","normalization"],e:"Sonuç birim vektördür."},
{w:1,t:'fill',q:"'hedef − konum' yerine 'konum − hedef' yazılırsa ajan hedeften uzaklaşır; bu bilerek kullanılan davranışın İngilizce adı ____ 'dir.",a:["flee","kacma","kaçma"],e:"Flee (kaçma) davranışı; seek'in tersi."},
{w:1,t:'fill',q:"Unity'de iki vektör arasındaki işaretli açıyı (pozitif = sağ) veren fonksiyon Vector3.____ 'dir.",a:["signedangle"],e:"Vector3.SignedAngle(ileri, hedefYönü, Vector3.up)."},

// ---------------- HAFTA 2
{w:2,t:'mc',q:"Kuvvetten konuma giden zincirin doğru sırası hangisidir?",o:["Konum → Hız → İvme → Kuvvet","Kuvvet → İvme → Hız → Konum","Kuvvet → Hız → İvme → Konum","İvme → Kuvvet → Konum → Hız"],a:1,e:"F → a = F/m → v += a·Δt → p += v·Δt. YZ yalnızca ilk halkaya karar verir."},
{w:2,t:'mc',q:"Hareket kodunda hızın Time.deltaTime (Δt) ile çarpılmasının amacı nedir?",o:["Hareketi yumuşatmak","Hareketi kare hızından (FPS) bağımsız yapmak","Yerçekimini eklemek","Çarpışmaları önlemek"],a:1,e:"Δt olmadan hızlı bilgisayarda karakter daha hızlı koşar."},
{w:2,t:'mc',q:"Derste kullanılan yarı örtük (semi-implicit) Euler adımında güncelleme sırası nedir?",o:["Önce konum, sonra hız","Önce hız, sonra konum","Yalnızca konum güncellenir","Hız ve konum aynı anda, eski değerlerle"],a:1,e:"Önce v = v + a·Δt, sonra p = p + v·Δt."},
{w:2,t:'mc',q:"Mermi atışında başlangıç süratini kütleden bağımsız tam olarak vermek için hangi ForceMode uygundur?",o:["Force","Acceleration","Impulse","VelocityChange"],a:3,e:"VelocityChange anlık hız değişimidir ve kütleyi yok sayar."},
{w:2,t:'mc',q:"Rigidbody'ye kuvvet uygulama hangi metotta yapılmalıdır?",o:["Update","LateUpdate","FixedUpdate","Start"],a:2,e:"Kural: girdi ve karar Update'te, kuvvet FixedUpdate'te (sabit fizik adımı)."},
{w:2,t:'mc',q:"Hareketli bir hedefe ateş ederken sorulması gereken doğru soru hangisidir?",o:["Hedef şu an nerede?","Mermi vardığı anda hedef nerede olacak?","Hedef ne kadar ağır?","Hedef bizi görüyor mu?"],a:1,e:"Kestirim: nişan = P + V·t."},
{w:2,t:'mc',q:"Balistik formülde kökün içi negatif çıkarsa YZ ne yapmalıdır?",o:["Alçak açıyla ateş etmeli","Yüksek açıyla ateş etmeli","Yaklaşmalı ya da ateş etmemeli; hedef menzil dışı","45° ile ateş etmeli"],a:2,e:"> 0 iki açı, = 0 tek açı (menzil sınırı), < 0 menzil dışı."},
{w:2,t:'tf',q:"Aynı kuvvet uygulandığında kütlesi büyük birim daha geç hızlanır, daha geç durur.",a:true,e:"a = F / m. Kütle karaktere 'ağırlık hissi' vermenin en ucuz yoludur."},
{w:2,t:'tf',q:"MaxForce değeri düşük olan ajan keskin ve ani manevralar yapar.",a:false,e:"Düşük MaxForce geniş, yavaş dönüşler; yüksek MaxForce keskin manevralar verir."},
{w:2,t:'tf',q:"Euler entegrasyonunda Δt küçüldükçe hata da küçülür.",a:true,e:"Euler hızı adım boyunca sabit sayar; adım küçülünce hata da küçülür."},
{w:2,t:'tf',q:"Transform ile kinematik hareket ettirilen bir nesne çarpışma tepkisi verir ve duvarlardan geçemez.",a:false,e:"Transform'u doğrudan değiştirmek çarpışmaları yok sayar; nesne duvardan geçebilir."},
{w:2,t:'tf',q:"Hız ile sürat aynı kavramdır.",a:false,e:"Hız vektördür (yön + büyüklük); sürat onun büyüklüğüdür."},
{w:2,t:'fill',q:"Hız vektörünün yönünü koruyup uzunluğunu MaxSpeed'e kısaltan işlemin adı ____ 'dir.",a:["truncate","kirpma","kırpma"],e:"Unity karşılığı Vector3.ClampMagnitude."},
{w:2,t:'fill',q:"Buckland'ın, topun sabit ivmeyle t saniye sonra nerede olacağını veren fonksiyonunun adı ____ 'dir.",a:["futureposition"],e:"x = u·t + ½·a·t². Mesafeye varış süresi için TimeToCoverDistance."},
{w:2,t:'fill',q:"Hedefe uzaktan ulaşamayacak bir pas, TimeToCoverDistance fonksiyonunun ____ döndürmesiyle baştan elenir.",a:["-1","eksi 1","eksi bir"],e:"−1 'ulaşamaz' anlamına gelir; simülasyon gerekmez."},

// ---------------- HAFTA 3
{w:3,t:'mc',q:"Her GameObject'te bulunan ve silinemeyen tek Component hangisidir?",o:["MeshRenderer","Collider","Transform","Rigidbody"],a:2,e:"Transform konum, dönüş ve ölçeği tutar."},
{w:3,t:'mc',q:"Takip kamerası hangi yaşam döngüsü metodunda güncellenmelidir?",o:["Awake","FixedUpdate","Update","LateUpdate"],a:3,e:"Karakter Update'te hareketini bitirir; kamera LateUpdate'te son konumu izler."},
{w:3,t:'mc',q:"Kamerada her karede Vector3.Lerp(konum, hedef, 0.1f) kullanmanın sorunu nedir?",o:["Kamera hiç yetişmez","Sonuç kare hızına (FPS) bağlı olur","Kamera titrer","Yalnızca Rigidbody ile çalışır"],a:1,e:"Çözüm: t = 1 − e^(−k·Δt). Böylece yumuşatma kare hızından bağımsız olur."},
{w:3,t:'mc',q:"Patlama gibi dış kuvvetlerden etkilenmeyen, eğim ve basamağı hazır çözen hareket yöntemi hangisidir?",o:["Rigidbody","CharacterController","Transform.Translate","NavMeshObstacle"],a:1,e:"CharacterController fizik motorunun dışında çalışır; Slope Limit ve Step Offset hazırdır."},
{w:3,t:'mc',q:"Kameraya göre hareket yönü hesaplanırken kameranın ileri vektörünün y bileşeni neden sıfırlanır?",o:["Karakter yere doğru itilmesin, yatayda tam hızla gitsin","Kamera dönmesin","Gamepad çalışsın","Yerçekimi kapansın"],a:0,e:"Düzleştirip normalize edince yatay yön elde edilir."},
{w:3,t:'mc',q:"Terrain'in normal ve eğim fonksiyonları hangi koordinatları ister?",o:["Dünya koordinatları","Ekran pikselleri","0–1 arası normalleştirilmiş (u, v)","Yerel uzay koordinatları"],a:2,e:"u = (x − x_arazi) / genişlik, v = (z − z_arazi) / uzunluk."},
{w:3,t:'mc',q:"Rigidbody karakterde zıplama isteği neden Update'te bir bayrağa yazılıp FixedUpdate'te tüketilir?",o:["WasPressedThisFrame yalnız bir karede true olur, o karede FixedUpdate çalışmayabilir","FixedUpdate'te girdi okunamaz","Bayrak daha az bellek kullanır","Zıplama yüksekliği hesaplanamaz"],a:0,e:"Girdi Update'te okunur, fiziksel tepki FixedUpdate'te verilir."},
{w:3,t:'tf',q:"Fare bağlı Look eyleminin değeri Time.deltaTime ile çarpılmalıdır.",a:false,e:"Fare değeri zaten bu karedeki piksel farkıdır. Gamepad çubuğu ise hız gibi davranır ve Δt ile çarpılır."},
{w:3,t:'tf',q:"Zıplama gibi bir kerelik işler için WasPressedThisFrame(), koşma gibi sürekli işler için IsPressed() kullanılır.",a:true,e:"Üçüncü sorgu WasReleasedThisFrame()'dir."},
{w:3,t:'tf',q:"Gözcü ödevinde engeller maskesine Player katmanı da eklenmelidir.",a:false,e:"Eklenirse ışın oyuncunun kendisine çarpar ve oyuncu engel sanılır."},
{w:3,t:'tf',q:"Oyuncu kapsülüne CharacterController eklenince Capsule Collider da bırakılmalıdır.",a:false,e:"CharacterController kendi kapsülünü getirir; ikisi bir arada sorun çıkarır."},
{w:3,t:'tf',q:"Rigidbody karakterde Interpolate açılmazsa kamera takibinde titreme görülebilir.",a:true,e:"Fizik adımı ile kare hızı arasındaki fark yumuşatılır."},
{w:3,t:'fill',q:"New Input System'de kod tuşları değil, 'Hareket et' ya da 'Zıpla' gibi niyetleri okur. Bu niyetlerin her birine ____ denir.",a:["action","eylem"],e:"Eylemler binding'lerle cihaz kontrollerine bağlanır."},
{w:3,t:'fill',q:"WASD gibi birden fazla tuştan tek bir Vector2 değeri üreten bağlama türüne ____ denir.",a:["composite","2d vector composite","2dvector"],e:"2D Vector composite'in varsayılan modu çaprazı normalleştirir."},
{w:3,t:'fill',q:"Gözcünün görüş hattını kontrol etmek için gözden oyuncuya Physics.Raycast ya da Physics.____ atılır.",a:["linecast"],e:"Işın bir engele çarpıyorsa oyuncu görülmez."},

// ---------------- HAFTA 4
{w:4,t:'mc',q:"A*'ta f = g + h formülünde h neyi ifade eder?",o:["Başlangıçtan bu düğüme gerçek maliyet","Bu düğümden hedefe tahmini (sezgisel) maliyet","Düğümün komşu sayısı","Yolun toplam uzunluğu"],a:1,e:"g: gelinen gerçek maliyet; h: sezgisel tahmin."},
{w:4,t:'mc',q:"h = 0 alınan A* hangi algoritmaya dönüşür?",o:["DFS","BFS","Dijkstra","Funnel"],a:2,e:"Dijkstra yalnızca g'ye bakar; daha çok düğüm genişletir."},
{w:4,t:'mc',q:"DFS ve BFS'in sınır (frontier) listeleri sırasıyla hangi veri yapılarıdır?",o:["Kuyruk / yığın","Yığın / kuyruk","Öncelik kuyruğu / yığın","Sözlük / liste"],a:1,e:"DFS yığın (son giren ilk çıkar), BFS kuyruk (ilk giren ilk çıkar). Dijkstra ve A* öncelik kuyruğu."},
{w:4,t:'mc',q:"Labirentte hücre boyunun 1 m yerine 2 m seçilmesinin nedeni nedir?",o:["Daha az bellek","Karakter kapsülü 1 m'lik koridora sığmaz, duvara takılır","A* daha hızlı çalışır","Arazi daha düzgün görünür"],a:1,e:"Izgara çözünürlüğü ajanın boyutuna göre seçilir; NavMesh bunu ajan yarıçapıyla yapar."},
{w:4,t:'mc',q:"Fareyle tıklarken neden katman maskeleri (Ground, Wall) kullanılır?",o:["Işının neye çarpacağını belirlemek için","Renkleri ayırmak için","NavMesh'i hızlandırmak için","Duvarları gizlemek için"],a:0,e:"Hedef seçerken yalnız zemin, duvar düzenlerken zemin + duvar gerekir."},
{w:4,t:'mc',q:"Unity'nin NavMesh ajanı hedefe yol bulamadığında ne yapar?",o:["Hata verip durur","Hedefe en yakın ulaşılabilir noktaya gidip durur","Hedefe ışınlanır","Rastgele dolaşır"],a:1,e:"Bizim A*'ımız ise 'yol yok' der ve karakter yerinde kalır."},
{w:4,t:'mc',q:"Oyunlarda harita değişince en yaygın yeniden planlama yaklaşımı hangisidir?",o:["Her karede her ajan için yeniden arama","Olaya bağlı yeniden planlama (yol kapanınca)","Hiç yeniden planlamamak","Oyunu yeniden başlatmak"],a:1,e:"Alternatifler: zaman aralıklı planlama ya da D* Lite gibi artımlı algoritmalar."},

const $ = s => document.querySelector(s);
const state = { mode:'study', weeks:new Set([1,2,3,4,5,6,7]), types:new Set(['mc','fill','tf']), items:[], answers:{}, finished:false };
let wrongIds = load('yzWrong', []);
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

Q.forEach((q,i) => q.id = i);
const TYPE_NAME = {mc:'Test', fill:'Boşluk doldurma', tf:'Doğru / Yanlış'};

function norm(s){
  return (s||'').toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s')
    .replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9\-]/g,'');
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Hafta çipleri
const wc = $('#weekChips');
for (let w=1; w<=7; w++){
  const b = document.createElement('button'); b.className='chip on'; b.textContent='H'+w; b.dataset.week=w;
  b.onclick = () => { state.weeks.has(w) ? state.weeks.delete(w) : state.weeks.add(w); b.classList.toggle('on'); };
  wc.appendChild(b);
}
document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
  const t=b.dataset.type; state.types.has(t) ? state.types.delete(t) : state.types.add(t); b.classList.toggle('on');
});
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.mode = b.dataset.mode; start(state.items.map(q=>q.id));
});
$('#startBtn').onclick = () => start(null);
$('#wrongBtn').onclick = () => {
  if (!wrongIds.length){ $('#info').textContent = 'Kayıtlı yanlışın yok. Önce bir deneme çöz.'; return; }
  start(wrongIds.slice());
};
$('#finishBtn').onclick = finish;
$('#themeBtn').onclick = () => {
  const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

function start(ids){
  if (ids && !ids.length) ids = null;
  let pool = ids ? Q.filter(q => ids.includes(q.id)) : Q.filter(q => state.weeks.has(q.w) && state.types.has(q.t));
  if (!ids) shuffle(pool);
  state.items = pool.map(q => q.t==='mc' ? {...q, order: shuffle(q.o.map((_,i)=>i))} : {...q});
  state.answers = {}; state.finished = false;
  $('#result').classList.add('hide');
  $('#finishBtn').textContent = state.mode==='exam' ? 'Sınavı bitir' : 'Sonucu göster';
  $('#info').textContent = `${pool.length} soru. ` + (state.mode==='exam' ? 'Cevaplar sınavı bitirince görünecek.' : 'Her cevaptan sonra doğrusu ve açıklaması görünür.');
  render(); window.scrollTo({top:0});
}

function render(){
  const list = $('#list'); list.innerHTML='';
  state.items.forEach((q, n) => {
    const d = document.createElement('div'); d.className='q'; d.id='q'+q.id;
    d.innerHTML = `<div class="meta"><span class="tag">${n+1}</span><span class="tag">Hafta ${q.w}</span><span class="tag">${TYPE_NAME[q.t]}</span></div><p class="qt"></p><div class="body"></div><div class="fbx"></div>`;
    d.querySelector('.qt').textContent = q.q;
    const body = d.querySelector('.body');
    if (q.t==='mc'){
      q.order.forEach(oi => {
        const b=document.createElement('button'); b.className='opt'; b.textContent=q.o[oi]; b.dataset.v=oi;
        b.onclick=()=>answer(q, oi); body.appendChild(b);
      });
    } else if (q.t==='tf'){
      const w=document.createElement('div'); w.className='tf';
      [['Doğru',true],['Yanlış',false]].forEach(([l,v])=>{
        const b=document.createElement('button'); b.className='opt'; b.textContent=l; b.dataset.v=v; b.onclick=()=>answer(q, v); w.appendChild(b);
      });
      body.appendChild(w);
    } else {
      const w=document.createElement('div'); w.className='fill';
      w.innerHTML='<input type="text" placeholder="Cevabını yaz…" autocomplete="off"><button class="btn">Cevapla</button>';
      const inp=w.querySelector('input'), btn=w.querySelector('button');
      const go=()=>{ if(inp.value.trim()) answer(q, inp.value.trim()); };
      btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
      body.appendChild(w);
    }
    list.appendChild(d);
  });
  progress();
}

function isCorrect(q, v){
  if (q.t==='mc') return v===q.a;
  if (q.t==='tf') return v===q.a;
  return q.a.some(x => norm(x)===norm(v));
}

function answer(q, v){
  if (state.finished) return;
  if (state.mode==='study' && q.id in state.answers) return;   // çalışma modunda tek hak
  state.answers[q.id] = v;
  const d = $('#q'+q.id);
  if (q.t!=='fill') d.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', String(b.dataset.v)===String(v)));
  if (state.mode==='study') reveal(q);
  progress();
}

function reveal(q){
  const d = $('#q'+q.id), v = state.answers[q.id], has = q.id in state.answers, ok = has && isCorrect(q, v);
  d.classList.add(ok ? 'ok' : 'bad');
  if (q.t!=='fill'){
    d.querySelectorAll('.opt').forEach(b => {
      const bv = q.t==='mc' ? Number(b.dataset.v) : b.dataset.v==='true';
      b.classList.remove('sel');
      if (bv===q.a) b.classList.add('right'); else if (has && bv===v) b.classList.add('wrong');
      b.disabled = true;
    });
  } else {
    d.querySelectorAll('input,button').forEach(x => x.disabled = true);
  }
  let correctText = q.t==='mc' ? q.o[q.a] : q.t==='tf' ? (q.a ? 'Doğru' : 'Yanlış') : q.a[0];
  const fb = d.querySelector('.fbx');
  fb.innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b></b><span></span></div>`;
  fb.querySelector('b').textContent = ok ? '✔ Doğru' : (has ? '✘ Yanlış — doğru cevap: ' : '— Boş bıraktın. Doğru cevap: ') + (ok ? '' : correctText);
  fb.querySelector('span').textContent = q.e;
}

function progress(){
  const total = state.items.length, done = Object.keys(state.answers).length;
  let right = 0; state.items.forEach(q => { if (q.id in state.answers && isCorrect(q, state.answers[q.id])) right++; });
  $('#progText').textContent = state.mode==='study' ? `${done} / ${total} cevaplandı · ${right} doğru` : `${done} / ${total} cevaplandı`;
  $('#progBar').style.width = total ? (100*done/total)+'%' : '0';
}

function finish(){
  if (!state.items.length) return;
  if (state.mode==='exam' && !state.finished){
    const empty = state.items.length - Object.keys(state.answers).length;
    if (empty > 0 && !confirm(`${empty} soru boş. Yine de bitirilsin mi?`)) return;
  }
  state.finished = true;
  state.items.forEach(q => reveal(q));

  const byWeek = {}; let right = 0;
  const wrong = [];
  state.items.forEach(q => {
    byWeek[q.w] = byWeek[q.w] || {r:0,n:0}; byWeek[q.w].n++;
    if (q.id in state.answers && isCorrect(q, state.answers[q.id])) { right++; byWeek[q.w].r++; } else wrong.push(q.id);
  });
  // yanlış listesini güncelle: bu denemede doğrulananları çıkar, yanlışları ekle
  const tested = new Set(state.items.map(q=>q.id));
  wrongIds = wrongIds.filter(id => !tested.has(id)).concat(wrong);
  save('yzWrong', wrongIds);

  const pct = Math.round(100*right/state.items.length);
  const rows = Object.keys(byWeek).sort().map(w => {
    const b = byWeek[w], p = Math.round(100*b.r/b.n);
    return `<tr><td>Hafta ${w}</td><td>${b.r} / ${b.n}</td><td>%${p}${p<60?' — tekrar et':''}</td></tr>`;
  }).join('');
  const r = $('#result');
  r.innerHTML = `<div class="small">Sonuç</div><div class="big">%${pct}</div><div>${right} / ${state.items.length} doğru · ${wrong.length} yanlış/boş</div>
    <table><tr><th>Hafta</th><th>Doğru</th><th>Başarı</th></tr>${rows}</table>
    <p class="small">Yanlışların kaydedildi; "Yalnızca yanlışlarımı tekrar çöz" ile yeniden deneyebilirsin.</p>`;
  r.classList.remove('hide');
  window.scrollTo({top:0, behavior:'smooth'});
}

start(null);
</script>
</body>
</html>
